name: Release

# Run from the Actions tab (Release → Run workflow) on main. It builds ProxyCraft on Windows with the
# FFmpeg pinned in get_ffmpeg.ps1 and publishes GitHub Release v<version from Cargo.toml> with the
# installer, both ZIPs, checksums and the FFmpeg source archives the GPL asks for.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release v$v already exists. Raise the version in Cargo.toml first." }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download the included FFmpeg
        shell: pwsh
        run: ./get_ffmpeg.ps1

      - name: Test (with the included FFmpeg)
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist, dist\licenses | Out-Null
          Copy-Item target\release\ProxyCraft.exe dist\
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist\
          Copy-Item licenses\* dist\licenses\
          Copy-Item -Recurse vendor\ffmpeg dist\ffmpeg
          $common = 'dist\ProxyCraft.exe','dist\README.md','dist\LICENSE.txt','dist\THIRD_PARTY_NOTICES.md','dist\licenses'
          Compress-Archive -Force -Path ($common + 'dist\ffmpeg') -DestinationPath "dist\ProxyCraft-$v-Windows.zip"
          Compress-Archive -Force -Path $common -DestinationPath "dist\ProxyCraft-$v-Windows-without-FFmpeg.zip"

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\ProxyCraft.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $files = @(
            "dist\ProxyCraft-$v-Setup.exe",
            "dist\ProxyCraft-$v-Windows.zip",
            "dist\ProxyCraft-$v-Windows-without-FFmpeg.zip"
          ) + (Get-ChildItem vendor\release-sources -File | ForEach-Object FullName)
          $sums = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          $sums | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          # Release notes: this version's section of CHANGELOG.md.
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))[^\n]*\n(.*?)(?=^## |\z)")
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n**Download:** ProxyCraft-$v-Setup.exe (recommended, FFmpeg included), or a portable ZIP with or without FFmpeg. Windows 10 or 11, 64-bit."
          $notes += "`n`nThe FFmpeg source archives are attached as required by FFmpeg's GPL licence. See THIRD_PARTY_NOTICES.md."
          $notes | Set-Content -Encoding utf8 dist\notes.md
          gh release create "v$v" --target $env:GITHUB_SHA --title "ProxyCraft $v" --notes-file dist\notes.md ($files + "dist\SHA256SUMS.txt")
